<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca.css">
<style>
.note{position:absolute;left:150px;top:150px;width:1150px;opacity:0;transform:translateY(40px);animation:entra 1.3s cubic-bezier(.2,.75,.2,1) forwards .2s}
.tela{background:#111;border-radius:20px 20px 0 0;padding:14px 14px 10px;box-shadow:0 40px 90px rgba(28,26,33,.22);height:670px;overflow:hidden}
.tela .rolo{border-radius:5px;overflow:hidden;height:100%}
.tela img{display:block;width:100%}
.base{height:24px;background:linear-gradient(#e8e4ea,#cfcad3);border-radius:0 0 16px 16px;margin:0 -54px}
.cel{position:absolute;left:1340px;top:110px;width:400px;height:840px;background:#111;border-radius:58px;padding:16px;box-shadow:0 40px 90px rgba(28,26,33,.28);opacity:0;transform:translateY(60px);animation:entra 1.4s cubic-bezier(.2,.75,.2,1) forwards 1.1s}
.cel .vidro{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;position:relative}
.cel img{display:block;width:100%;animation:rola 9s cubic-bezier(.45,.05,.3,1) forwards 3.2s}
.cel .ilha{position:absolute;top:12px;left:50%;width:110px;height:30px;margin-left:-55px;background:#111;border-radius:20px;z-index:2}
.rolo img{animation:rola2 9s cubic-bezier(.45,.05,.3,1) forwards 3.6s}
@keyframes entra{to{opacity:1;transform:none}}
@keyframes rola{to{transform:translateY(var(--rolagem,-900px))}}
@keyframes rola2{to{transform:translateY(-240px)}}
</style></head><body><div class="palco">
<div class="costura" style="top:9%"></div><div class="costura" style="top:93%"></div>
<div class="note"><div class="tela"><div class="rolo"><img src="img/painel-longo.png" alt=""></div></div><div class="base"></div></div>
<div class="cel"><div class="vidro"><div class="ilha"></div><img id="celimg" src="img/celular-longo.png" alt=""></div></div>
</div></body></html>
