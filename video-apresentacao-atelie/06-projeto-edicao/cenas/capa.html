<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca.css">
<style>
.esq{position:absolute;left:110px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.esq .icone{width:120px;height:120px;border-radius:28px}
.esq .nome{font-size:92px;line-height:.98;letter-spacing:.04em}
.esq .tag{font-size:34px;line-height:1.3}
.selo{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--rosa);color:#fff;font-weight:700;font-size:26px;padding:14px 26px;border-radius:999px;box-shadow:0 12px 30px rgba(201,45,106,.3)}
.selo:before{content:"";width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.note{position:absolute;left:800px;top:190px;width:1050px}
.tela{background:#111;border-radius:20px 20px 0 0;padding:14px 14px 10px;box-shadow:0 40px 90px rgba(28,26,33,.25)}
.tela img{display:block;width:100%;border-radius:5px}
.base{height:24px;background:linear-gradient(#e8e4ea,#cfcad3);border-radius:0 0 16px 16px;margin:0 -50px}
.cel{position:absolute;left:1600px;top:500px;width:262px;height:430px;background:#111;border-radius:40px;padding:11px;box-shadow:0 30px 70px rgba(28,26,33,.3)}
.cel .vidro{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff}
.cel img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body><div class="palco">
<div class="costura" style="top:12%"></div><div class="costura" style="top:90%"></div>
<div class="esq"><img class="icone" src="img/icone.svg" alt=""><div class="nome">ATELIÊ<br><b>JESSICA</b></div>
<div class="tag">Gestão inteligente para costura: clientes, ordens de serviço, produção, agenda e financeiro.</div>
<div class="selo">Conheça o sistema</div></div>
<div class="note"><div class="tela"><img src="img/painel.png" alt=""></div><div class="base"></div></div>
<div class="cel"><div class="vidro"><img src="img/celular-tela.png" alt=""></div></div>
</div></body></html>
