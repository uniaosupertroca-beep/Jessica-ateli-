<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca.css">
<style>
.centro{position:absolute;inset:0;display:grid;place-items:center}
.marca{animation:sobe 1s cubic-bezier(.2,.7,.2,1) both .15s, sai .9s cubic-bezier(.6,0,.4,1) forwards 3.3s}
.icone{animation:ic 1s cubic-bezier(.2,.8,.2,1.2) both .1s}
.nome{animation:aparece .9s ease both .5s}
.linha{animation:risca .9s cubic-bezier(.6,0,.2,1) forwards 1s}
.tag{animation:aparece .9s ease both 1.4s}
@keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ic{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes risca{to{width:600px}}
@keyframes sai{to{transform:translateY(-120px) scale(.8);opacity:0}}
.cel{position:absolute;left:50%;top:50%;width:720px;height:1460px;margin:-730px 0 0 -360px;background:#111;border-radius:96px;padding:24px;box-shadow:0 50px 110px rgba(28,26,33,.3);opacity:0;transform:translateY(120px) scale(.9);animation:celin 1.3s cubic-bezier(.2,.75,.2,1) forwards 3.7s, celout 1.2s cubic-bezier(.6,0,.3,1) forwards 6.4s}
.cel .vidro{width:100%;height:100%;border-radius:74px;overflow:hidden;background:#fff;position:relative}
.cel img{display:block;width:100%}
.cel .ilha{position:absolute;top:20px;left:50%;width:190px;height:52px;margin-left:-95px;background:#111;border-radius:30px;z-index:2}
@keyframes celin{to{opacity:1;transform:none}}
@keyframes celout{to{transform:scale(1.5);opacity:0}}
.final{position:absolute;inset:0;background:url(img/celular-tela.png) top/cover;opacity:0;animation:fim 1.1s cubic-bezier(.4,0,.2,1) forwards 6.6s}
@keyframes fim{to{opacity:1}}
</style></head><body class="vertical"><div class="palco">
<div class="costura" style="top:16%"></div><div class="costura" style="top:86%;animation-direction:reverse"></div>
<div class="centro"><div class="marca"><img class="icone" src="img/icone.svg" alt="">
<div class="nome">ATELIÊ<br><b>JESSICA</b></div><div class="linha"></div>
<div class="tag">Seu ateliê merece mais organização.</div></div></div>
<div class="cel"><div class="vidro"><div class="ilha"></div><img src="img/celular-tela.png" alt=""></div></div>
<div class="final"></div>
</div></body></html>
