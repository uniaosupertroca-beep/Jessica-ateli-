<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca.css">
<style>
.fundo{position:absolute;inset:-40px;background:url(img/painel.png) center/cover;filter:blur(14px) saturate(.9);opacity:.35;transform:scale(1.08);animation:deriva 12s linear both}
.veu{position:absolute;inset:0;background:radial-gradient(900px 520px at 50% 50%,rgba(248,246,248,.96),rgba(248,246,248,.82))}
@keyframes deriva{from{transform:scale(1.08) translateX(-20px)}to{transform:scale(1.14) translateX(20px)}}
.centro{position:absolute;inset:0;display:grid;place-items:center}
.icone{animation:ic 1.2s cubic-bezier(.2,.8,.2,1.2) both .3s}
.nome{animation:aparece 1.1s ease both .8s}
.linha{animation:risca 1s cubic-bezier(.6,0,.2,1) forwards 1.4s}
.tag{animation:aparece 1s ease both 1.9s}
@keyframes ic{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes risca{to{width:480px}}
.sai{position:absolute;inset:0;background:var(--fundo);opacity:0;animation:fim 1.4s ease forwards var(--fim,9.2s)}
@keyframes fim{to{opacity:1}}
</style></head><body><div class="palco">
<div class="fundo"></div><div class="veu"></div>
<div class="costura" style="top:20%"></div><div class="costura" style="top:82%"></div>
<div class="centro"><div class="marca"><img class="icone" src="img/icone.svg" alt="">
<div class="nome">ATELIÊ <b>JESSICA</b></div><div class="linha"></div>
<div class="tag" id="tag">Gestão inteligente para costura.</div></div></div>
<div class="sai"></div>
</div><script>const q=new URLSearchParams(location.search);if(q.get('tag'))document.getElementById('tag').textContent=q.get('tag');if(q.get('vertical')){document.body.classList.add('vertical');document.querySelector('.nome').innerHTML='ATELIÊ<br><b>JESSICA</b>';}if(q.get('fim'))document.querySelector('.sai').style.setProperty('--fim',q.get('fim'));</script></body></html>
