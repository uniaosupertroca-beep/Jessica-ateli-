<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca.css">
<style>
.centro{position:absolute;inset:0;display:grid;place-items:center}
.marca{animation:sobe 1.4s cubic-bezier(.2,.7,.2,1) both .3s, sai 1.2s cubic-bezier(.6,0,.4,1) forwards 6.2s}
.icone{animation:ic 1.3s cubic-bezier(.2,.8,.2,1.2) both .2s}
.nome{animation:aparece 1.2s ease both .9s}
.linha{animation:risca 1.1s cubic-bezier(.6,0,.2,1) forwards 1.6s}
.tag{animation:aparece 1.1s ease both 2.1s}
.costura{animation:costura 7s linear both}
@keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ic{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes risca{to{width:520px}}
@keyframes sai{to{transform:translateY(-330px) scale(.42);opacity:0}}
@keyframes costura{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
/* computador com o painel real */
.note{position:absolute;left:50%;top:50%;width:1240px;transform:translate(-50%,-30%) scale(.92);opacity:0;animation:nota 1.6s cubic-bezier(.2,.75,.2,1) forwards 6.5s, entra 1.5s cubic-bezier(.6,0,.3,1) forwards 9.8s}
.tela{background:#111;border-radius:22px 22px 0 0;padding:16px 16px 12px;box-shadow:0 40px 90px rgba(28,26,33,.25)}
.tela img{display:block;width:100%;border-radius:6px}
.base{height:26px;background:linear-gradient(#e8e4ea,#cfcad3);border-radius:0 0 18px 18px;margin:0 -60px;box-shadow:0 18px 40px rgba(28,26,33,.18)}
@keyframes nota{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* no fim, a tela do computador cresce até ocupar o vídeo (emenda com a gravação real) */
@keyframes entra{to{transform:translate(-50%,-50%) scale(1.32);opacity:.0}}
.final{position:absolute;inset:0;background:url(img/painel.png) center/cover;opacity:0;transform:scale(.94);animation:fim 1.4s cubic-bezier(.4,0,.2,1) forwards 10.1s}
@keyframes fim{to{opacity:1;transform:none}}
</style></head><body><div class="palco">
<div class="costura" style="top:24%"></div><div class="costura" style="top:78%;animation-direction:reverse"></div>
<div class="centro"><div class="marca"><img class="icone" src="img/icone.svg" alt="">
<div class="nome">ATELIÊ <b>JESSICA</b></div><div class="linha"></div>
<div class="tag">Tecnologia e praticidade para o seu negócio.</div></div></div>
<div class="note"><div class="tela"><img src="img/painel.png" alt=""></div><div class="base"></div></div>
<div class="final"></div>
</div></body></html>
