<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ateliê Jessica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: barra lateral fixa no computador, menu inferior no celular; conteúdo em painéis brancos sobre fundo de linho frio. */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#1D2236; --muted:#5F6680; --line:#D9DCE6;
  --accent:#A92D63; --accent-ink:#FFFFFF; --accent-soft:#F7E4ED;
  --ok:#23775A; --ok-soft:#DDF1E8; --warn:#9A6312; --warn-soft:#FBEED6; --crit:#B5352A; --crit-soft:#FADFDB; --info:#2F5E9E; --info-soft:#DFE9F7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1B1E2A; --sunk:#232736; --ink:#E8EAF3; --muted:#9BA1B8; --line:#2E3345;
  --accent:#E5709F; --accent-ink:#1B0E14; --accent-soft:#3A2130;
  --ok:#55C796; --ok-soft:#173327; --warn:#E5AE55; --warn-soft:#3A2C14; --crit:#F07466; --crit-soft:#3D1D1A; --info:#7FAAE8; --info-soft:#1C2A40;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1B1E2A; --sunk:#232736; --ink:#E8EAF3; --muted:#9BA1B8; --line:#2E3345;
  --accent:#E5709F; --accent-ink:#1B0E14; --accent-soft:#3A2130;
  --ok:#55C796; --ok-soft:#173327; --warn:#E5AE55; --warn-soft:#3A2C14; --crit:#F07466; --crit-soft:#3D1D1A; --info:#7FAAE8; --info-soft:#1C2A40;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}
.proto{background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600;text-align:center;padding:6px 16px}
.app{display:flex;min-height:calc(100% - 30px)}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.25rem}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fita{height:12px;margin:0 10px 14px;background:
  repeating-linear-gradient(90deg,var(--accent) 0 1px,transparent 1px 40px) 0 0/100% 12px no-repeat,
  repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 8px) 0 6px/100% 6px no-repeat;opacity:.55}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.bottom{display:none}
main{flex:1;min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.s21{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.s12{grid-template-columns:minmax(0,1fr) minmax(0,2fr);align-items:start}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--f-display);font-size:1.7rem;font-weight:700}
.stat .sub{font-size:.85rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--accent);padding:4px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;min-height:60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-neutral{background:var(--sunk);color:var(--ink)} .p-info{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-muted{background:var(--sunk);color:var(--muted)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li .t{font-weight:600} .li .s{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.pins{display:inline-flex;gap:3px;align-items:center}
.pins i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);display:block}
.pins i.f{border-color:currentColor;background:currentColor}
.s-livre{color:var(--ok)} .s-quase{color:var(--warn)} .s-lotado{color:var(--crit)}
/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.day{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:78px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left}
.day:hover{border-color:var(--muted)}
.day.out{opacity:.35}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.day.hoje .dn{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.day .dn{font-weight:700;align-self:flex-start}
.day .cnt{font-size:.78rem;font-weight:600}
.day.lotado{background:var(--crit-soft)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:var(--surface);min-width:62px}
.chip .w{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip .d{font-weight:700;font-size:.9rem}
.chip .c{font-size:.72rem;font-weight:600}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.alert{padding:10px 12px;border-radius:8px;font-size:.9rem;font-weight:500}
.a-crit{background:var(--crit-soft);color:var(--crit)} .a-warn{background:var(--warn-soft);color:var(--warn)} .a-info{background:var(--info-soft);color:var(--info)}
/* Itens da OS */
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:1.3fr 1.5fr 1.2fr 64px 100px 96px 32px;gap:8px;align-items:center}
.it-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.it .sub{text-align:right}
.x{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px}
.x:hover{color:var(--crit)}
.totais{display:grid;grid-template-columns:auto auto;gap:6px 24px;justify-content:end;align-items:baseline}
.totais .k{color:var(--muted);text-align:right}
.totais .v{text-align:right}
.totais .big{font-size:1.25rem}
.flow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.flow span{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600}
.flow span.on{background:var(--accent);color:var(--accent-ink)}
.flow span.done{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
[hidden]{display:none!important}
.mbox{background:var(--surface);border-radius:12px;width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.mbox.wide{width:min(860px,100%)}
.mact{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
/* Folha A4 */
.a4wrap{background:var(--sunk);padding:16px;border-radius:8px;overflow-x:auto}
.a4{background:#fff;color:#1a1a1a;width:794px;min-height:1000px;margin:0 auto;padding:44px 48px;font-size:12.5px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.a4 h2{font-size:20px;color:#1a1a1a}
.a4 .top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1a1a1a;padding-bottom:12px}
.a4 table th{color:#555;border-bottom:1px solid #999}
.a4 table td{border-bottom:1px solid #ddd}
.a4 .box{border:1px solid #bbb;border-radius:6px;padding:10px 12px}
.a4 .ass{margin-top:auto;display:flex;gap:40px;padding-top:40px}
.a4 .ass div{flex:1;border-top:1px solid #333;text-align:center;padding-top:6px;color:#555}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);text-decoration:none;font-weight:600;padding:4px 6px;border-radius:8px}
  .bottom a.on{color:var(--accent)}
  .bottom svg{width:20px;height:20px}
  main{padding-bottom:90px}
  .g2,.s21,.s12{grid-template-columns:minmax(0,1fr)}
  .it{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px;position:relative}
  .it-h{display:none}
  .it .x{position:absolute;top:2px;right:2px}
  .it .sub{grid-column:span 2}
  .day{min-height:58px;padding:5px}
  .day .pins{display:none}
}
@media (max-width:480px){.g3{grid-template-columns:minmax(0,1fr)} .stat .val{font-size:1.3rem} .panel{padding:14px} h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- regras ---------- */
function mkLanc(tipo, data, valor, forma, cat, desc, os, extra){ return Object.assign({id:uid(), tipo, data, valor, forma, cat, desc, os:os||null}, extra||{}); }
function somaItens(itens){ return itens.reduce((s,i) => s + (i.qtd||0)*(i.valor||0), 0); }
const sv = l => l.tipo === 'entrada' ? l.valor : -l.valor;
const pagoOS = id => id ? S.lanc.filter(l => l.os === id).reduce((s,l) => s + sv(l), 0) : 0;
function totais(o){ const soma = somaItens(o.itens); const total = Math.max(0, soma - (o.desconto||0)); const pago = pagoOS(o.id); return {soma, total, pago, saldo: total - pago}; }
const cli = id => S.clientes.find(c => c.id === id);
const serv = id => S.servicos.find(s => s.id === id);
const forma = id => S.formas.find(f => f.id === id);
const catFin = id => S.catsFin.find(c => c.id === id);
function ocupacao(date, ignorarId){ return S.os.filter(o => o.entrega === date && o.status !== 'cancelada' && o.id !== ignorarId).length; }
function situacao(n){ return n >= S.config.capacidade ? 'lotado' : n >= S.config.limite ? 'quase' : 'livre'; }
function esperadoDinheiro(d){ const c = S.caixas[d]; return (c ? c.inicial : 0) + S.lanc.filter(l => l.data === d && forma(l.forma)?.dinheiro).reduce((s,l) => s + sv(l), 0); }
const atrasada = o => o.entrega < TODAY && !['entregue','cancelada'].includes(o.status);
const ST = {aberta:['Aberta','neutral'], em_producao:['Em produção','info'], pronta:['Pronta','ok'], entregue:['Entregue','muted'], cancelada:['Cancelada','crit']};
const FLOW = ['aberta','em_producao','pronta','entregue'];
const pill = st => `<span class="pill p-${ST[st][1]}">${ST[st][0]}</span>`;
function pins(n){ const cap = S.config.capacidade; let h = ''; for (let i=0;i<cap;i++) h += `<i class="${i<n?'f':''}"></i>`; return `<span class="pins s-${situacao(n)}" aria-hidden="true">${h}</span>`; }

/* ---------- UI: modal, confirmação, toast ---------- */
let modalActs = [];
function modal({title, body, actions, wide}){
  modalActs = actions || [{label:'Fechar'}];
  $('#modal').innerHTML = `<div class="mbox ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${title}</h2><div>${body||''}</div>
    <div class="mact">${modalActs.map((a,i) => `<button class="btn ${a.cls||''}" data-mact="${i}">${a.label}</button>`).join('')}</div></div>`;
  $('#modal').hidden = false;
  const f = $('#modal input, #modal select, #modal textarea'); if (f) f.focus();
}
function closeModal(){ $('#modal').hidden = true; $('#modal').innerHTML = ''; }
function confirmar(title, msg, okLabel, onOk, danger){
  modal({title, body:`<p style="margin:0">${msg}</p>`, actions:[{label:'Voltar'},{label:okLabel, cls: danger ? 'danger' : 'pri', fn:onOk}]});
}
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const b = e.target.closest('[data-mact]'); if (!b) return;
  const a = modalActs[+b.dataset.mact];
  if (a.fn && a.fn() === false) return;
  const chained = $('#modal').dataset.chain; delete $('#modal').dataset.chain;
  if (!chained) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
// abre um novo modal a partir de uma ação de modal sem que ele seja fechado em seguida
function chain(fn){ closeModal(); $('#modal').dataset.chain = '1'; fn(); }

/* ---------- caixa ---------- */
function requireCaixa(cb){
  const c = S.caixas[TODAY];
  if (c && !c.fechado) return cb();
  if (c && c.fechado) {
    return modal({title:'O caixa de hoje está fechado', body:'<p style="margin:0">Para lançar algo hoje, reabra o caixa. A reabertura fica registrada.</p>',
      actions:[{label:'Voltar'},{label:'Reabrir caixa', cls:'pri', fn:() => { c.fechado = null; c.reaberto = new Date().toLocaleTimeString('pt-BR').slice(0,5); chain(cb); render(); }}]});
  }
  modal({title:'Abrir o caixa de hoje', body:`<p style="margin:0 0 12px">Nenhum caixa aberto em ${fDY(TODAY)}. Informe o troco inicial em dinheiro para começar.</p>
    <div class="field"><label for="m-troco">Troco inicial (R$)</label><input class="in num" id="m-troco" inputmode="decimal" value="100,00"></div>`,
    actions:[{label:'Voltar'},{label:'Abrir caixa', cls:'pri', fn:() => { S.caixas[TODAY] = {inicial: parseBRL($('#m-troco').value), aberto:TODAY}; chain(cb); render(); }}]});

function salvarOS(force, after){
  const d = ui.osEdit;
  d.itens = d.itens.filter((it,i) => it.peca.trim() || it.servico || it.valor || d.itens.length === 1);
  if (!d.cliente) return toast('Escolha a cliente antes de salvar.');
  if (!d.entrega) return toast('Informe a data de entrega.');
  if (d.entrega < d.entrada) return toast('A entrega não pode ser antes da entrada.');
  if (!d.itens.some(it => it.peca.trim() || it.servico)) return toast('Adicione pelo menos uma peça ou serviço.');
  if (d.desconto > somaItens(d.itens)) return toast('O desconto é maior que a soma dos itens.');
  const n = ocupacao(d.entrega, d.id);
  const orig = d.id && S.os.find(o => o.id === d.id);
  if (!force && n >= S.config.capacidade && (!orig || orig.entrega !== d.entrega))
    return confirmar('Dia lotado', `${fDW(d.entrega)} já tem ${n} de ${S.config.capacidade} entregas. Encaixar esta OS mesmo assim?`, 'Encaixar mesmo assim', () => chain(() => salvarOS(true, after)));

  else { Object.assign(orig, JSON.parse(JSON.stringify(d))); if (!after) toast('OS salva.'); }

  render();
}

}

/* ---------- FINANCEIRO ---------- */
const FT = [['caixa','Caixa do dia'],['lanc','Lançamentos'],['receber','A receber'],['pagar','A pagar'],['resumo','Resumo']];
function vFin(){
  const R = {caixa:finCaixa, lanc:finLanc, receber:finReceber, pagar:finPagar, resumo:finResumo};
  return `<div class="head"><div><h1>Financeiro</h1><p>Entradas, saídas, caixa e contas do ateliê</p></div>
      <div class="row"><button class="btn" data-act="novo-lanc" data-tipo="saida">− Nova saída</button><button class="btn pri" data-act="novo-lanc" data-tipo="entrada">+ Nova entrada</button></div></div>
    <div class="tabs">${FT.map(([k,l]) => `<button class="${ui.finTab===k?'on':''}" data-act="fin-tab" data-tab="${k}">${l}</button>`).join('')}</div>${R[ui.finTab]()}`;
}
function lancTable(rows, showDate){
  if (!rows.length) return '<div class="empty">Nenhum lançamento.</div>';
  return `<div class="tw"><table><thead><tr>${showDate?'<th>Data</th>':''}<th>Descrição</th><th>Categoria</th><th>Forma</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${rows.map(l => `<tr>${showDate?`<td>${fD(l.data)}</td>`:''}<td>${esc(l.desc)}${l.os ? ` <button class="btn link sm" data-act="abrir-os" data-id="${l.os}">ver OS</button>` : ''}</td><td class="muted">${esc(catFin(l.cat).nome)}</td><td>${esc(forma(l.forma).nome)}</td>
      <td class="r num" style="color:${l.tipo==='entrada'?'var(--ok)':'var(--crit)'};white-space:nowrap">${l.tipo==='entrada'?'+ ':'− '}${brl(l.valor)}</td>
      <td class="r">${l.estornadoPor ? '<span class="pill p-muted">Estornado</span>' : l.estornoDe ? '<span class="pill p-warn">Estorno</span>' : `<button class="btn sm" data-act="estornar" data-id="${l.id}">Estornar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
}
function finCaixa(){
  const c = S.caixas[TODAY], ls = S.lanc.filter(l => l.data === TODAY);
  if (!c) return `<div class="panel" style="align-items:flex-start"><h2>Caixa de ${fDY(TODAY)} não foi aberto</h2><p class="muted" style="margin:0">Abra o caixa informando o troco inicial em dinheiro.</p><button class="btn pri" data-act="abrir-caixa">Abrir caixa</button></div>`;
  const porForma = S.formas.map(f => { const e = ls.filter(l => l.forma===f.id && l.tipo==='entrada').reduce((s,l)=>s+l.valor,0), sa = ls.filter(l => l.forma===f.id && l.tipo==='saida').reduce((s,l)=>s+l.valor,0); return {f,e,sa}; }).filter(x => x.e || x.sa || x.f.dinheiro);
  const ent = ls.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+l.valor,0), sai = ls.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
  const esp = esperadoDinheiro(TODAY);
  const dif = c.fechado ? c.contado - esp : null;
  const ontem = Object.keys(S.caixas).filter(d => d < TODAY).sort().pop();
  const co = ontem && S.caixas[ontem], difOntem = co ? co.contado - esperadoDinheiro(ontem) : 0;
  return `<div class="grid g4">
      <div class="panel stat"><span class="lbl">Troco inicial</span><span class="val num">${brl(c.inicial)}</span><span class="sub">${c.reaberto ? 'reaberto às ' + c.reaberto : 'caixa aberto hoje'}</span></div>
      <div class="panel stat"><span class="lbl">Entradas</span><span class="val num" style="color:var(--ok)">${brl(ent)}</span><span class="sub">${ls.filter(l=>l.tipo==='entrada').length} lançamentos</span></div>
      <div class="panel stat"><span class="lbl">Saídas</span><span class="val num" style="color:var(--crit)">${brl(sai)}</span><span class="sub">${ls.filter(l=>l.tipo==='saida').length} lançamentos</span></div>
      <div class="panel stat"><span class="lbl">Dinheiro na gaveta</span><span class="val num">${brl(esp)}</span><span class="sub">esperado agora</span></div></div>
    ${co && difOntem ? `<div class="alert a-warn">Fechamento de ${fD(ontem)}: diferença de ${brl(difOntem)} (${difOntem<0?'faltou':'sobrou'} dinheiro na gaveta).</div>` : ''}
    <div class="grid s12">
      <div class="panel"><div class="panel-h"><h2>Por forma de pagamento</h2></div>
        <table><thead><tr><th>Forma</th><th class="r">Entradas</th><th class="r">Saídas</th></tr></thead><tbody>${porForma.map(x => `<tr><td>${esc(x.f.nome)}</td><td class="r num">${brl(x.e)}</td><td class="r num">${brl(x.sa)}</td></tr>`).join('')}</tbody></table>
        ${c.fechado ? `<div class="alert ${dif===0?'a-info':'a-warn'}">Caixa fechado. Contado ${brl(c.contado)}, esperado ${brl(esp)}. ${dif===0?'Sem diferença.':'Diferença de '+brl(dif)+'.'}</div>
          <button class="btn" data-act="reabrir-caixa">Reabrir caixa</button>` : `<button class="btn pri" data-act="fechar-caixa">Fechar caixa</button>`}</div>
      <div class="panel"><div class="panel-h"><h2>Lançamentos de hoje</h2></div>${lancTable(ls.slice().reverse(), false)}</div></div>`;
}
function inPer(d, per){ if (per==='tudo') return true; if (per==='hoje') return d===TODAY; if (per==='7d') return d > addDays(TODAY,-7) && d <= TODAY; if (per==='mes') return d.slice(0,7)===TODAY.slice(0,7); }
const PER = [['hoje','Hoje'],['7d','Últimos 7 dias'],['mes','Este mês'],['tudo','Tudo']];
function finLanc(){
  const rows = S.lanc.filter(l => inPer(l.data, ui.lancPer) && (!ui.lancTipo || l.tipo === ui.lancTipo)).sort((a,b) => b.data.localeCompare(a.data));
  return `<div class="panel"><div class="row"><select class="in" id="lanc-per" style="width:auto">${PER.map(([k,l]) => `<option value="${k}" ${ui.lancPer===k?'selected':''}>${l}</option>`).join('')}</select>
    <select class="in" id="lanc-tipo" style="width:auto"><option value="">Entradas e saídas</option><option value="entrada" ${ui.lancTipo==='entrada'?'selected':''}>Só entradas</option><option value="saida" ${ui.lancTipo==='saida'?'selected':''}>Só saídas</option></select>
    <span class="muted" style="font-size:.85rem">Lançamentos não são apagados. Para corrigir, use Estornar.</span></div>${lancTable(rows, true)}</div>`;
}
function finReceber(){
  const rows = S.os.filter(o => o.status !== 'cancelada' && totais(o).saldo > 0).sort((a,b) => (b.status==='pronta') - (a.status==='pronta') || a.entrega.localeCompare(b.entrega));
  const tot = rows.reduce((s,o) => s + totais(o).saldo, 0);
  return `<div class="panel"><div class="panel-h"><h2>A receber</h2><span class="num" style="font-weight:700;font-size:1.1rem">${brl(tot)}</span></div>
    <div class="tw"><table><thead><tr><th>OS</th><th>Cliente</th><th>Entrega</th><th>Status</th><th class="r">Total</th><th class="r">Pago</th><th class="r">Falta</th></tr></thead><tbody>
    ${rows.map(o => { const t = totais(o); return `<tr class="click" data-act="abrir-os" data-id="${o.id}"><td class="num">${nOS(o.numero)}</td><td>${esc(cli(o.cliente).nome)}</td><td>${fDW(o.entrega)}</td>
      <td>${pill(o.status)}${o.status==='pronta'?' <span class="pill p-warn">Cobrar na retirada</span>':''}</td><td class="r num">${brl(t.total)}</td><td class="r num">${brl(t.pago)}</td><td class="r num" style="color:var(--warn);font-weight:600">${brl(t.saldo)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}
function finPagar(){
  const rows = S.contas.slice().sort((a,b) => (a.status!=='aberta') - (b.status!=='aberta') || a.venc.localeCompare(b.venc));
  const ab = S.contas.filter(k => k.status==='aberta').reduce((s,k) => s + k.valor, 0);
  return `<div class="panel"><div class="panel-h"><h2>Contas a pagar</h2><div class="row"><span class="num" style="font-weight:700">${brl(ab)} em aberto</span><button class="btn pri sm" data-act="nova-conta">+ Nova conta</button></div></div>
    <div class="tw"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th>Situação</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${rows.map(k => `<tr><td>${fDW(k.venc)}</td><td>${esc(k.desc)}</td><td class="muted">${esc(catFin(k.cat).nome)}</td>
      <td>${k.status==='paga' ? `<span class="pill p-ok">Paga em ${fD(k.paga)}</span>` : k.status==='cancelada' ? '<span class="pill p-muted">Cancelada</span>' : k.venc < TODAY ? '<span class="pill p-crit">Vencida</span>' : k.venc <= addDays(TODAY,7) ? '<span class="pill p-warn">Vence em breve</span>' : '<span class="pill p-neutral">Em aberto</span>'}</td>
      <td class="r num">${brl(k.valor)}</td><td class="r">${k.status==='aberta' ? `<button class="btn pri sm" data-act="pagar-conta" data-id="${k.id}">Pagar</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function finResumo(){
  const ls = S.lanc.filter(l => inPer(l.data, ui.resPer));
  const ent = ls.filter(l => catFin(l.cat).tipo==='entrada').reduce((s,l) => s + sv(l), 0);
  const sai = -ls.filter(l => catFin(l.cat).tipo==='saida').reduce((s,l) => s + sv(l), 0);
  const porCat = tipo => S.catsFin.filter(c => c.tipo===tipo).map(c => ({c, v: Math.abs(ls.filter(l => l.cat===c.id).reduce((s,l) => s + sv(l), 0))})).filter(x => x.v).sort((a,b) => b.v - a.v);
  const bloco = (tipo, cor) => { const xs = porCat(tipo), max = Math.max(1, ...xs.map(x => x.v));
    return xs.map(x => `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px"><span>${esc(x.c.nome)}</span><span class="num">${brl(x.v)}</span><div class="bar" style="grid-column:span 2"><i style="width:${x.v/max*100}%;background:${cor}"></i></div></div>`).join('') || '<div class="empty">Nada no período.</div>'; };
  return `<div class="row"><select class="in" id="res-per" style="width:auto">${PER.map(([k,l]) => `<option value="${k}" ${ui.resPer===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="grid g3"><div class="panel stat"><span class="lbl">Entradas</span><span class="val num" style="color:var(--ok)">${brl(ent)}</span></div>
      <div class="panel stat"><span class="lbl">Saídas</span><span class="val num" style="color:var(--crit)">${brl(sai)}</span></div>
      <div class="panel stat"><span class="lbl">Resultado</span><span class="val num">${brl(ent - sai)}</span></div></div>
    <div class="grid g2"><div class="panel"><h2>Entradas por categoria</h2>${bloco('entrada','var(--ok)')}</div><div class="panel"><h2>Saídas por categoria</h2>${bloco('saida','var(--crit)')}</div></div>`;
}
function novoLanc(tipo){
  requireCaixa(() => modal({title: tipo==='entrada' ? 'Nova entrada' : 'Nova saída', body:`<div class="grid" style="gap:12px">
    <div class="field"><label for="m-desc">Descrição</label><input class="in" id="m-desc" placeholder="${tipo==='entrada'?'Ex.: venda de aviamentos':'Ex.: compra de linhas'}"></div>
    <div class="field"><label for="m-val">Valor (R$)</label><input class="in num" id="m-val" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label for="m-cat">Categoria</label><select class="in" id="m-cat">${S.catsFin.filter(c => c.tipo===tipo).map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-forma">Forma de pagamento</label><select class="in" id="m-forma">${S.formas.filter(f=>f.ativo).map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div></div>`,
    actions:[{label:'Voltar'},{label:'Lançar', cls:'pri', fn:() => { const v = parseBRL($('#m-val').value), d = $('#m-desc').value.trim();
      if (!d) { toast('Informe a descrição.'); return false; } if (!v) { toast('Informe um valor maior que zero.'); return false; }
      S.lanc.push(mkLanc(tipo, TODAY, v, $('#m-forma').value, $('#m-cat').value, d)); toast((tipo==='entrada'?'Entrada':'Saída') + ' de ' + brl(v) + ' lançada.'); render(); }}]}));
}
function fecharCaixa(){
  const esp = esperadoDinheiro(TODAY);
  modal({title:'Fechar o caixa de ' + fD(TODAY), body:`<div class="grid" style="gap:12px"><p style="margin:0">Conte o dinheiro da gaveta. O sistema esperava <b class="num">${brl(esp)}</b>.</p>
    <div class="field"><label for="m-cont">Valor contado (R$)</label><input class="in num" id="m-cont" inputmode="decimal" value="${cents2in(esp)}"></div><div id="m-dif" class="alert a-info">Sem diferença.</div>
    <p class="muted" style="margin:0;font-size:.85rem">Depois de fechado, o caixa de hoje não aceita novos lançamentos, a não ser que seja reaberto.</p></div>`,
    actions:[{label:'Voltar'},{label:'Fechar caixa', cls:'pri', fn:() => { const c = S.caixas[TODAY]; c.contado = parseBRL($('#m-cont').value); c.fechado = TODAY; toast('Caixa fechado.'); render(); }}]});
  $('#m-cont').addEventListener('input', e => { const d = parseBRL(e.target.value) - esp; const el = $('#m-dif');
    el.className = 'alert ' + (d===0 ? 'a-info' : 'a-warn'); el.textContent = d===0 ? 'Sem diferença.' : (d<0 ? 'Faltam ' : 'Sobram ') + brl(Math.abs(d)) + ' na gaveta.'; });
}
function novaConta(){
  modal({title:'Nova conta a pagar', body:`<div class="grid" style="gap:12px"><div class="field"><label for="m-desc">Descrição</label><input class="in" id="m-desc" placeholder="Ex.: aluguel de dezembro"></div>
    <div class="grid g2" style="gap:12px"><div class="field"><label for="m-val">Valor (R$)</label><input class="in num" id="m-val" inputmode="decimal"></div>
    <div class="field"><label for="m-venc">Vencimento</label><input class="in" type="date" id="m-venc" value="${addDays(TODAY,10)}"></div></div>
    <div class="field"><label for="m-cat">Categoria</label><select class="in" id="m-cat">${S.catsFin.filter(c => c.tipo==='saida').map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div></div>`,
    actions:[{label:'Voltar'},{label:'Cadastrar', cls:'pri', fn:() => { const v = parseBRL($('#m-val').value), d = $('#m-desc').value.trim();
      if (!d || !v) { toast('Preencha descrição e valor.'); return false; }
      S.contas.push({id:uid(), desc:d, valor:v, venc:$('#m-venc').value || TODAY, cat:$('#m-cat').value, status:'aberta'}); toast('Conta cadastrada.'); render(); }}]});
}
function pagarConta(id){
  const k = S.contas.find(x => x.id === id);
  requireCaixa(() => modal({title:'Pagar: ' + esc(k.desc), body:`<div class="grid" style="gap:12px"><p style="margin:0">Valor: <b class="num">${brl(k.valor)}</b>. O pagamento vira uma saída no caixa de hoje.</p>
    <div class="field"><label for="m-forma">Forma de pagamento</label><select class="in" id="m-forma">${S.formas.filter(f=>f.ativo).map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div></div>`,
    actions:[{label:'Voltar'},{label:'Confirmar pagamento', cls:'pri', fn:() => { S.lanc.push(mkLanc('saida', TODAY, k.valor, $('#m-forma').value, k.cat, k.desc, null, {conta:k.id})); k.status='paga'; k.paga=TODAY; toast('Conta paga.'); render(); }}]}));
}

/* ---------- CONFIGURAÇÕES ---------- */
const CT = [['atelie','Ateliê'],['servicos','Categorias e serviços'],['precos','Tabelas de preço'],['fin','Financeiro']];
function vCfg(){
  const R = {atelie:cfgAtelie, servicos:cfgServicos, precos:cfgPrecos, fin:cfgFin};
  return `<div class="head"><div><h1>Configurações</h1><p>As mudanças valem na hora para todo o sistema.</p></div></div>
    <div class="tabs">${CT.map(([k,l]) => `<button class="${ui.cfgTab===k?'on':''}" data-act="cfg-tab" data-tab="${k}">${l}</button>`).join('')}</div>${R[ui.cfgTab]()}`;
}
function cfgAtelie(){
  const c = S.config, f = (k, l, t) => `<div class="field"><label for="cfg-${k}">${l}</label><input class="in ${t==='number'?'num':''}" id="cfg-${k}" data-cfg="${k}" ${t?`type="${t}" min="1"`:''} value="${esc(c[k])}"></div>`;

    <div class="panel"><h2>Capacidade da agenda</h2>${f('capacidade','Entregas por dia (lotado a partir de)','number')}${f('limite','Mostrar "quase cheio" a partir de','number')}

function cfgServicos(){
  return `<div class="panel"><div class="row"><input class="in" id="nova-cat" placeholder="Nova categoria" style="flex:1;min-width:180px"><button class="btn" data-act="add-cat">Adicionar categoria</button></div>
    <div class="row"><select class="in" id="ns-cat" style="width:auto">${S.categorias.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select><input class="in" id="ns-nome" placeholder="Novo serviço" style="flex:1;min-width:180px">
      <button class="btn pri" data-act="add-serv">Adicionar serviço</button></div></div>
    <div class="grid g2">${S.categorias.map(c => `<div class="panel"><div class="panel-h"><h2 style="${c.ativo?'':'opacity:.5'}">${esc(c.nome)}</h2><button class="btn sm" data-act="tog-cat" data-id="${c.id}">${c.ativo?'Desativar':'Ativar'}</button></div>
      <div class="list">${S.servicos.filter(s => s.cat===c.id).map(s => `<div class="li" style="cursor:default"><span style="${s.ativo?'':'opacity:.5;text-decoration:line-through'}">${esc(s.nome)}</span>
        <span class="row"><span class="num muted">${brl(S.precos.t1[s.id]||0)}</span><button class="btn sm" data-act="tog-serv" data-id="${s.id}">${s.ativo?'Desativar':'Ativar'}</button></span></div>`).join('') || '<div class="empty">Nenhum serviço.</div>'}</div></div>`).join('')}</div>
    <p class="muted" style="margin:0;font-size:.88rem">Itens já usados em OS são desativados em vez de apagados, para o histórico continuar correto.</p>`;

function cfgPrecos(){
  return `<div class="panel"><div class="panel-h"><h2>Preço de cada serviço por tabela</h2><div class="row"><input class="in" id="nova-tab" placeholder="Nome da nova tabela" style="width:200px"><button class="btn" data-act="add-tab">Criar tabela (copia a Padrão)</button></div></div>
    <div class="tw"><table><thead><tr><th>Serviço</th>${S.tabelas.map(t => `<th class="r">${esc(t.nome)}${t.padrao?' · padrão':''}</th>`).join('')}</tr></thead><tbody>
    ${S.categorias.map(c => `<tr><td colspan="${S.tabelas.length+1}" style="font-weight:700;background:var(--sunk)">${esc(c.nome)}</td></tr>` + S.servicos.filter(s => s.cat===c.id).map(s => `<tr><td>${esc(s.nome)}</td>
      ${S.tabelas.map(t => `<td class="r"><input class="in num" data-preco="${t.id}|${s.id}" inputmode="decimal" value="${cents2in((S.precos[t.id]||{})[s.id]||0)}" style="width:110px;text-align:right" aria-label="${esc(s.nome)} na tabela ${esc(t.nome)}"></td>`).join('')}</tr>`).join('')).join('')}

}
function cfgFin(){
  const lista = (tipo, t) => `<div class="panel"><h2>${t}</h2><div class="list">${S.catsFin.filter(c => c.tipo===tipo).map(c => `<div class="li" style="cursor:default"><span>${esc(c.nome)}</span></div>`).join('')}</div>
    <div class="row"><input class="in" id="ncf-${tipo}" placeholder="Nova categoria" style="flex:1"><button class="btn sm" data-act="add-catfin" data-tipo="${tipo}">Adicionar</button></div></div>`;
  return `<div class="grid g2">${lista('entrada','Categorias de entrada')}${lista('saida','Categorias de saída')}
    <div class="panel"><h2>Formas de pagamento</h2><div class="list">${S.formas.map(f => `<div class="li" style="cursor:default"><span style="${f.ativo?'':'opacity:.5;text-decoration:line-through'}">${esc(f.nome)}${f.dinheiro?' <span class="pill p-neutral">conta na gaveta</span>':''}</span>
      <button class="btn sm" data-act="tog-forma" data-id="${f.id}">${f.ativo?'Desativar':'Ativar'}</button></div>`).join('')}</div>
      <div class="row"><input class="in" id="nova-forma" placeholder="Ex.: Vale-presente" style="flex:1"><button class="btn sm" data-act="add-forma">Adicionar</button></div></div></div>`;
}

const A = {
  'nova-os': () => { ui.osEdit = novaOS(); go('os'); },
  'nova-os-dia': b => { ui.osEdit = novaOS(); ui.osEdit.entrega = b.dataset.d; go('os'); },
  'nova-os-cli': () => { ui.osEdit = novaOS(ui.cliente); go('os'); },
  'abrir-os': b => abrirOS(b.dataset.id),
  'voltar-os': () => { ui.osEdit = null; render(); },
  'salvar-os': () => salvarOS(false),
  'add-item': () => { ui.osEdit.itens.push({peca:'', servico:'', descricao:'', qtd:1, valor:0}); renderItens(); updTotais(); const r = document.querySelectorAll('#itens .it:not(.it-h)'); r[r.length-1].querySelector('input').focus(); },
  'rm-item': b => { ui.osEdit.itens.splice(+b.dataset.i,1); renderItens(); updTotais(); },
  'set-entrega': b => { ui.osEdit.entrega = b.dataset.d; $('#f-entrega').value = b.dataset.d; renderStrip(); },
  'status': b => setStatus(b.dataset.st),
  'cancelar-os': cancelarOS,
  'pagar-os': pagarOS,
  'imprimir': imprimir,
  'estornar': b => estornar(b.dataset.id),
  'cli-rapido': () => cliRapido(c => { ui.osEdit.cliente = c.id; render(); }),
  'dia': b => { ui.dia = b.dataset.d; if (b.dataset.d.slice(0,7) !== ui.mes) ui.mes = b.dataset.d.slice(0,7); render(); },
  'mes': b => { const [y,m] = ui.mes.split('-').map(Number); const d = new Date(y, m-1+(+b.dataset.n), 1, 12); ui.mes = ymd(d).slice(0,7); render(); },
  'agview': b => { ui.agView = b.dataset.v; render(); },
  'semana': b => { ui.dia = addDays(ui.dia, +b.dataset.n); ui.mes = ui.dia.slice(0,7); render(); },
  'nova-cli': () => cliRapido(c => { ui.cliente = c.id; render(); }),
  'abrir-cli': b => { ui.cliente = b.dataset.id; render(); window.scrollTo(0,0); },
  'voltar-cli': () => { ui.cliente = null; render(); },
  'editar-cli': () => { const c = cli(ui.cliente); modal({title:'Editar cliente', body:`<div class="grid" style="gap:12px"><div class="field"><label for="m-nome">Nome</label><input class="in" id="m-nome" value="${esc(c.nome)}"></div>
      <div class="field"><label for="m-tel">Telefone</label><input class="in" id="m-tel" value="${fmtTel(c.tel)}"></div><div class="field"><label for="m-obs">Observações</label><textarea class="in" id="m-obs">${esc(c.obs)}</textarea></div></div>`,
      actions:[{label:'Voltar'},{label:'Salvar', cls:'pri', fn:() => { const n = $('#m-nome').value.trim(); if (!n) { toast('Informe o nome.'); return false; } c.nome = n; c.tel = $('#m-tel').value.replace(/\D/g,''); c.obs = $('#m-obs').value.trim(); toast('Cliente atualizada.'); render(); }}]}); },
  'fin-tab': b => { ui.finTab = b.dataset.tab; render(); },
  'ir-fin': b => { ui.finTab = b.dataset.tab; go('financeiro'); },
  'novo-lanc': b => novoLanc(b.dataset.tipo),
  'abrir-caixa': () => requireCaixa(() => toast('Caixa aberto.')),
  'fechar-caixa': fecharCaixa,
  'reabrir-caixa': () => confirmar('Reabrir o caixa de hoje?', 'A reabertura fica registrada. Lembre de fechar de novo no fim do dia.', 'Reabrir', () => { const c = S.caixas[TODAY]; c.fechado = null; c.reaberto = new Date().toLocaleTimeString('pt-BR').slice(0,5); render(); }),
  'nova-conta': novaConta,
  'pagar-conta': b => pagarConta(b.dataset.id),
  'cfg-tab': b => { ui.cfgTab = b.dataset.tab; render(); },
  'add-cat': () => { const n = $('#nova-cat').value.trim(); if (!n) return toast('Digite o nome da categoria.'); S.categorias.push({id:uid(), nome:n, ativo:true}); render(); toast('Categoria criada.'); },
  'add-serv': () => { const n = $('#ns-nome').value.trim(); if (!n) return toast('Digite o nome do serviço.'); const s = {id:uid(), cat:$('#ns-cat').value, nome:n, ativo:true}; S.servicos.push(s); S.tabelas.forEach(t => (S.precos[t.id] ||= {})[s.id] = 0); render(); toast('Serviço criado. Defina o preço em Tabelas de preço.'); },
  'tog-cat': b => { const c = S.categorias.find(x => x.id === b.dataset.id); c.ativo = !c.ativo; render(); },
  'tog-serv': b => { const s = serv(b.dataset.id); s.ativo = !s.ativo; render(); },
  'add-tab': () => { const n = $('#nova-tab').value.trim(); if (!n) return toast('Digite o nome da tabela.'); const t = {id:uid(), nome:n, padrao:false}; S.tabelas.push(t); S.precos[t.id] = {...S.precos.t1}; render(); toast('Tabela criada com os preços da Padrão.'); },
  'add-catfin': b => { const el = $('#ncf-' + b.dataset.tipo), n = el.value.trim(); if (!n) return toast('Digite o nome da categoria.'); S.catsFin.push({id:uid(), nome:n, tipo:b.dataset.tipo}); render(); },
  'add-forma': () => { const n = $('#nova-forma').value.trim(); if (!n) return toast('Digite o nome da forma.'); S.formas.push({id:uid(), nome:n, ativo:true}); render(); },
  'tog-forma': b => { const f = forma(b.dataset.id); f.ativo = !f.ativo; render(); }
};
$('#main').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; e.preventDefault(); e.stopPropagation(); A[b.dataset.act](b); });

$('#main').addEventListener('input', e => {
  const t = e.target, d = ui.osEdit;
  if (t.id === 'os-busca') { ui.osBusca = t.value; $('#os-tabela').innerHTML = osTabela(); return; }
  if (t.id === 'cli-busca') { ui.cliBusca = t.value; $('#cli-tabela').innerHTML = cliTabela(); return; }
  if (t.dataset.cfg) { const k = t.dataset.cfg; S.config[k] = t.type === 'number' ? Math.max(1, parseInt(t.value)||1) : t.value; if (k==='nome') $('#brand-nome').textContent = t.value; return; }
  if (t.dataset.preco) { const [tid,sid] = t.dataset.preco.split('|'); (S.precos[tid] ||= {})[sid] = parseBRL(t.value); return; }
  if (!d) return;
  const row = t.closest('.it');
  if (row && t.dataset.f) { const it = d.itens[+row.dataset.i], f = t.dataset.f;
    if (f === 'qtd') it.qtd = Math.max(0, parseInt(t.value)||0); else if (f === 'valor') it.valor = parseBRL(t.value); else if (f !== 'servico') it[f] = t.value;
    updTotais(); return; }
  if (t.id === 'f-desc') { d.desconto = parseBRL(t.value); updTotais(); }
  if (t.id === 'f-obs') d.obs = t.value;
});
$('#main').addEventListener('change', e => {
  const t = e.target, d = ui.osEdit;
  if (t.id === 'os-status') { ui.osStatus = t.value; $('#os-tabela').innerHTML = osTabela(); return; }
  if (t.id === 'lanc-per') { ui.lancPer = t.value; render(); return; }
  if (t.id === 'lanc-tipo') { ui.lancTipo = t.value; render(); return; }
  if (t.id === 'res-per') { ui.resPer = t.value; render(); return; }
  if (t.dataset.cfg && t.type === 'number') { render(); return; }
  if (!d) return;
  const row = t.closest('.it');
  if (row && t.dataset.f === 'servico') { const it = d.itens[+row.dataset.i]; it.servico = t.value;
    if (t.value) { it.valor = (S.precos[d.tabela]||{})[t.value] || 0; row.querySelector('[data-f="valor"]').value = cents2in(it.valor); if (!it.peca.trim()) row.querySelector('[data-f="peca"]').focus(); }
    updTotais(); return; }
  if (t.id === 'f-cli') { d.cliente = t.value; $('#cli-info').innerHTML = cliInfo(t.value); }
  if (t.id === 'f-entrada') { d.entrada = t.value; renderStrip(); }
  if (t.id === 'f-entrega') { d.entrega = t.value; renderStrip(); }
  if (t.id === 'f-tab') { d.tabela = t.value; let n = 0; d.itens.forEach(it => { if (it.servico) { it.valor = (S.precos[d.tabela]||{})[it.servico] || 0; n++; } }); renderItens(); updTotais();
    if (n) toast('Preços atualizados pela tabela ' + S.tabelas.find(x => x.id === d.tabela).nome + '.'); }
});

seed();
render();
})();
</script>
</body>
</html>
